# Project-specific settings, sourced by every hook. Edit these for your repo.

# The branch each task branch is cut from and compared against.
BASE_BRANCH="main"

# Where scripts/approve.sh creates each task's worktree, relative to the repo
# root. Empty means ../<repo-name>-worktrees.
WORKTREE_ROOT=""

# Where acceptance tests live. Only the test engineer writes here.
ACCEPTANCE_DIR="tests/acceptance"

# Paths the test engineer must not read (the implementation).
SRC_DENY=("apps")

# Exceptions inside SRC_DENY the test engineer may read (public types, API schemas).
PUBLIC_ALLOW=()

# Paths the technical writer may write.
DOC_PATHS=("docs" "README.md" "CHANGELOG.md")

# Paths the technical writer may not write.
DOC_PATH_DENY=("docs/original-spec-notes.md")

# Command that runs only the acceptance tests. Used to confirm they fail
# before the developer starts. Leave empty to skip that check.
ACCEPTANCE_CMD="tests/acceptance/run.sh"

# How many times a stop hook sends an agent back before letting it stop
# and recording a failure for the delivery lead to escalate.
MAX_STOP_BLOCKS=3
