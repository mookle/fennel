openapi: 3.1.0
info:
  title: Fennel product
  version: "0.1.0"
  description: >
    The product catalogue for Fennel. This service owns products, SKUs,
    attributes and options, labels, and shipping cost calculation. The cart
    service consumes the read endpoints and the shipping quote, so those must
    stay stable. The management endpoints are the own surface of the product
    domain. Money is a decimal string, paired with an ISO-4217 currency
    (ADR-0017).
servers:
  - url: http://product.internal/v1
    description: In-cluster base URL
security:
  - internalBearer: []
tags:
  - name: catalogue
    description: Read endpoints consumed by the cart service (stable contract)
  - name: products
    description: Product-domain management
  - name: skus
    description: SKU management
  - name: labels
  - name: shipping

paths:
  /products:
    get:
      tags: [catalogue]
      summary: Query/search the catalogue
      parameters:
        - { name: shop_id, in: query, schema: { type: string } }
        - { name: label, in: query, schema: { type: string }, description: canonical label slug }
        - { name: q, in: query, schema: { type: string }, description: free-text search }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ProductStatus' }, description: defaults to active for public reads }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Page of products
          content:
            application/json:
              schema:
                type: object
                required: [items, page, page_size, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Product' } }
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
              examples:
                default: { $ref: '#/components/examples/ProductPage' }
    post:
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /products/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [catalogue]
      summary: Get a product with attributes, options and SKUs
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
              examples:
                default: { $ref: '#/components/examples/ProductDetailExample' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [products]
      summary: Update a product or transition its status
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductPatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The business rules reject the change, for example a status transition that is not allowed from the current status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /products/{id}/attributes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [products]
      summary: Add an attribute (with options) to a product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttributeWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attribute' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /skus:
    post:
      tags: [skus]
      summary: Create a SKU from a combination of attribute options
      description: The seller supplies the code, and the server never generates one. An SKU code must be unique per shop, and a clash returns a 409 naming the existing code (ADR-0023).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sku' }
        '409': { $ref: '#/components/responses/Conflict' }

  /skus/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [catalogue]
      summary: Resolve a SKU
      responses:
        '200':
          description: Resolved SKU
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolvedSku' }
              examples:
                default: { $ref: '#/components/examples/ResolvedSkuSingle' }
        '404': { $ref: '#/components/responses/NotFound' }

  /skus:batchGet:
    post:
      tags: [catalogue]
      summary: Resolve many SKUs at once (cart/checkout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku_ids]
              properties:
                sku_ids: { type: array, items: { type: string, format: uuid }, minItems: 1 }
      responses:
        '200':
          description: >
            Resolved SKUs for the ids that exist. missing lists ids that were
            not found so the caller can fail the affected lines.
          content:
            application/json:
              schema:
                type: object
                required: [items, missing]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ResolvedSku' } }
                  missing: { type: array, items: { type: string, format: uuid } }
              examples:
                default: { $ref: '#/components/examples/SkuBatch' }

  /shipping/quote:
    post:
      tags: [shipping]
      summary: Quote shipping for a set of lines to a destination
      description: >
        The cost calculation lives in the product domain and is opaque to
        its callers. Callers should group by shop before quoting.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShippingQuoteRequest' }
      responses:
        '200':
          description: Per-line and total shipping cost
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShippingQuoteResponse' }
              examples:
                default: { $ref: '#/components/examples/ShippingQuote' }
        '422':
          description: One or more lines cannot ship to the destination
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /labels:
    get:
      tags: [labels]
      summary: List canonical labels (drives site categories)
      responses:
        '200':
          description: Labels
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Label' } }
    post:
      tags: [labels]
      summary: Create a label (optionally with aliases)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabelWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Label' }

components:
  securitySchemes:
    internalBearer:
      type: http
      scheme: bearer
      description: Shared in-cluster bearer token. No mTLS in this build (ADR-0008).

  schemas:
    Money:
      type: string
      description: >
        Numeric(15,4) as a string to preserve precision, never a JSON number
        (ADR-0017). A response pads to exactly four decimal places. The pattern
        stays looser than that, so a request does not have to pad.
      pattern: '^-?\d{1,11}(\.\d{1,4})?$'
      example: "12.5000"
    Currency:
      type: string
      description: ISO-4217 code.
      pattern: '^[A-Z]{3}$'
      example: "GBP"
    ProductStatus:
      type: string
      enum: [incomplete, active, hidden, archived, reported, deleted]

    Product:
      type: object
      required: [id, shop_id, name, status, currency]
      properties:
        id: { type: string, format: uuid }
        shop_id: { type: string }
        name: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/ProductStatus' }
        base_price:
          allOf:
            - $ref: '#/components/schemas/Money'
          readOnly: true
          description: the lowest price among the product's SKUs. Absent while the product has none (ADR-0027)
        currency: { $ref: '#/components/schemas/Currency' }
        label_slugs: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: the last write. Equals created_at on an untouched row (ADR-0018) }
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            attributes: { type: array, items: { $ref: '#/components/schemas/Attribute' } }
            skus: { type: array, items: { $ref: '#/components/schemas/Sku' } }
    ProductWrite:
      type: object
      required: [shop_id, name, currency]
      properties:
        shop_id: { type: string }
        name: { type: string }
        description: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        label_slugs: { type: array, items: { type: string } }
    ProductPatch:
      type: object
      description: Any subset of the fields. The service validates a status change against the allowed transitions.
      properties:
        name: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/ProductStatus' }
        label_slugs: { type: array, items: { type: string } }

    Attribute:
      type: object
      required: [id, product_id, name, options]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        name: { type: string }
        options: { type: array, items: { $ref: '#/components/schemas/AttributeOption' } }
    AttributeOption:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    AttributeWrite:
      type: object
      required: [name, options]
      properties:
        name: { type: string }
        options:
          type: array
          minItems: 1
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }

    Sku:
      type: object
      required: [id, product_id, code, price, currency, available_quantity]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        code: { type: string, example: "APN0MTS" }
        price: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        available_quantity: { type: integer, minimum: 0 }
        option_ids: { type: array, items: { type: string, format: uuid } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: the last write. Equals created_at on an untouched row (ADR-0018) }
    SkuWrite:
      type: object
      required: [product_id, code, option_ids, price, available_quantity]
      properties:
        product_id: { type: string, format: uuid }
        code: { type: string, description: seller-supplied, unique per shop (ADR-0023) }
        option_ids: { type: array, items: { type: string, format: uuid }, description: one option per attribute the product holds. Empty for a product with no attributes }
        price: { $ref: '#/components/schemas/Money' }
        available_quantity: { type: integer, minimum: 0 }
    ResolvedSku:
      type: object
      description: >
        A denormalised read model, not the SKU row: the SKU joined with its
        product's name, description and shop_id, the resolved option names,
        and the stock. It is self-contained so that checkout can crystallise
        a Purchase line from one payload with no follow-up read (ADR-0004).
      required: [sku_id, product_id, shop_id, sku_code, name, price, currency, available_quantity]
      properties:
        sku_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        shop_id: { type: string }
        sku_code: { type: string }
        name: { type: string, description: product name at time of read }
        description: { type: string }
        price: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        available_quantity: { type: integer, minimum: 0 }
        options:
          type: array
          items:
            type: object
            properties:
              attribute: { type: string }
              value: { type: string }

    ShippingQuoteRequest:
      type: object
      required: [destination, items]
      properties:
        destination:
          type: object
          required: [country_id]
          properties:
            country_id: { type: string }
            region_id: { type: string, nullable: true }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku_id, quantity]
            properties:
              sku_id: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
    ShippingQuoteResponse:
      type: object
      required: [currency, lines, total]
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        lines:
          type: array
          items:
            type: object
            required: [sku_id, cost]
            properties:
              sku_id: { type: string, format: uuid }
              cost: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }

    Label:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: canonical }
        slug: { type: string }
        aliases: { type: array, items: { type: string } }
    LabelWrite:
      type: object
      required: [name]
      properties:
        name: { type: string }
        aliases: { type: array, items: { type: string } }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: array, items: { type: string } }

  examples:
    # Canonical payloads for the endpoints `cart` consumes (ADR-0015). These are
    # the source for cart's test doubles: extract them, do not transcribe them.
    # Note the deliberate shapes: money is a padded decimal string (ADR-0017),
    # and updated_at is always present, equal to created_at until the first
    # write (ADR-0018).
    ProductPage:
      summary: One page of the catalogue query
      value:
        items:
          - id: "019df242-3b00-7b38-a574-35b288b2eef2"
            shop_id: "shop_42"
            name: "A Pretty necklace"
            description: "Hand-made silver pendant on a fine chain."
            status: "active"
            base_price: "24.0000"
            currency: "GBP"
            label_slugs: ["jewellery", "silver"]
            created_at: "2026-05-04T09:12:00Z"
            updated_at: "2026-05-04T09:12:00Z"
          - id: "019dfdbc-4f70-7746-b01b-05c48c3c3156"
            shop_id: "shop_7"
            name: "Beeswax Wrap Set"
            description: "Three reusable food wraps."
            status: "active"
            base_price: "12.5000"
            currency: "GBP"
            label_slugs: ["kitchen"]
            created_at: "2026-05-06T14:41:10Z"
            updated_at: "2026-06-01T08:00:00Z"
        page: 1
        page_size: 20
        total: 2

    ProductDetailExample:
      summary: Product detail with attributes, options and SKUs
      value:
        id: "019df242-3b00-7b38-a574-35b288b2eef2"
        shop_id: "shop_42"
        name: "A Pretty necklace"
        description: "Hand-made silver pendant on a fine chain."
        status: "active"
        base_price: "24.0000"
        currency: "GBP"
        label_slugs: ["jewellery", "silver"]
        created_at: "2026-05-04T09:12:00Z"
        updated_at: "2026-05-04T09:12:00Z"
        attributes:
          - id: "019df242-3b00-7151-ba7e-81e8052d193f"
            product_id: "019df242-3b00-7b38-a574-35b288b2eef2"
            name: "Material"
            options:
              - id: "019df242-3b00-772e-8e16-74fe37e5173e"
                name: "Silver"
              - id: "019df242-3b00-738c-90d1-1d6d3809d595"
                name: "Gold"
        skus:
          - id: "019df244-fa20-72b6-a1cf-300ff7354d1d"
            product_id: "019df242-3b00-7b38-a574-35b288b2eef2"
            code: "APN0MTS"
            price: "24.0000"
            currency: "GBP"
            available_quantity: 3
            option_ids: ["019df242-3b00-772e-8e16-74fe37e5173e"]
            created_at: "2026-05-04T09:15:00Z"
            updated_at: "2026-05-04T09:15:00Z"

    ResolvedSkuSingle:
      summary: A single resolved SKU, as read at checkout
      value:
        sku_id: "019df244-fa20-72b6-a1cf-300ff7354d1d"
        product_id: "019df242-3b00-7b38-a574-35b288b2eef2"
        shop_id: "shop_42"
        sku_code: "APN0MTS"
        name: "A Pretty necklace"
        description: "Hand-made silver pendant on a fine chain."
        price: "24.0000"
        currency: "GBP"
        available_quantity: 3
        options:
          - attribute: "Material"
            value: "Silver"

    SkuBatch:
      summary: Batch resolution with one id that no longer exists
      value:
        items:
          - sku_id: "019df244-fa20-72b6-a1cf-300ff7354d1d"
            product_id: "019df242-3b00-7b38-a574-35b288b2eef2"
            shop_id: "shop_42"
            sku_code: "APN0MTS"
            name: "A Pretty necklace"
            description: "Hand-made silver pendant on a fine chain."
            price: "24.0000"
            currency: "GBP"
            available_quantity: 3
            options:
              - attribute: "Material"
                value: "Silver"
          - sku_id: "019dfdbc-4f70-7952-bc65-165ee40433e7"
            product_id: "019dfdbc-4f70-7746-b01b-05c48c3c3156"
            shop_id: "shop_7"
            sku_code: "BWS0"
            name: "Beeswax Wrap Set"
            price: "12.5000"
            currency: "GBP"
            available_quantity: 0
            options: []
        missing: ["019dfdbc-4f70-75fd-9edf-f8c045786f4a"]

    ShippingQuote:
      summary: Per-line and total cost for one shop grouping
      value:
        currency: "GBP"
        lines:
          - sku_id: "019df244-fa20-72b6-a1cf-300ff7354d1d"
            cost: "3.9500"
          - sku_id: "019dfdbc-4f70-7952-bc65-165ee40433e7"
            cost: "0.0000"
        total: "3.9500"

  responses:
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Uniqueness clash. The body names the existing code
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
